# 直径 6 m 的大篝火：外圈 28 根、内圈 14 根直径 25 cm 的原木斜靠成 4 m 高的圆锥，中心垫三层木垛
# 预期：充分燃烧后热释放率十几到几十 MW，火焰 8–12 m 高，上方大股灰黑烟柱

[domain]
size = [16.0, 24.0, 16.0]
cell = 0.1

[sim]
duration = 12
cfl = 1.5
vorticity = 6

[[object]]
kind = "bonfire"
material = "wood"
center = [8.0, 0.0, 8.0]
radius = 3.0
size = [0.0, 4.0, 0.0]
count = 28
stick = 0.25

# 大面积点火：模拟从底部燃料床同时引燃
[ignition]
pos = [8.0, 0.4, 8.0]
radius = 2.2
flux = 80000
temp = 1300
until = 30.0

# 木材热解气碳烟较少：火焰内碳烟生成量取产率的 1 倍、氧化加快（对照试验中最接近真实木头大火的外观）
[fuel]
soot_formation_ratio = 1.0
soot_oxidation = 10.0

[wind]
speed = 0.8
dir = 20

[render]
width = 1280
height = 720
spp = 32
# 在 22 m 外、略低的位置仰拍
camera = [8.0, 1.6, -14.0]
target = [8.0, 7.5, 8.0]
fov = 55
ground_albedo = 0.15

[output]
dir = "../renders/bonfire"
preroll = 28.0
